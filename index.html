<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  /* 손님이 글씨를 길게 눌러도 드래그·선택·복사·검색 메뉴가 뜨지 않게 한다.

    font-family: Roboto, "Noto Sans KR", -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "맑은 고딕", sans-serif;
    background:#333;
    display:flex; justify-content:center; align-items:center;
    overflow:hidden;
    overscroll-behavior:none;
  }

  /* 폰 프레임 */
  #phone {
    width:100%; max-width:430px; height:100vh; height:100dvh; max-height:930px;
    background:#fff; position:relative; overflow:hidden;
    display:flex; flex-direction:column;
    box-shadow:0 0 40px rgba(0,0,0,.4);
  }

  .yt { background:#fff; color:#0f0f0f; display:flex; flex-direction:column; min-height:0;

  #ytScreen { flex:1; }
  .yt-head { height:54px; flex-shrink:0; display:flex; align-items:center; padding:0 7px 0 5px; }

    color:#0f0f0f; }
  .yt-back svg { width:25px; height:25px; display:block; }
  .yt-search { flex:1; min-width:0; height:34px; margin-left:6px; border-radius:17px; background:#f2f2f2;
    display:flex; align-items:center; padding:0 13px; overflow:hidden; white-space:nowrap; }
  .yt-caret { width:1.6px; height:19px; background:#0f0f0f; flex-shrink:0; margin-right:1px;

  .yt-caret.off { display:none; }
  @-webkit-keyframes ytBlink { 0%{opacity:1} 50%{opacity:0} }
  @keyframes ytBlink { 0%{opacity:1} 50%{opacity:0} }
  .yt-ph { font-size:16px; color:#606060; overflow:hidden; text-overflow:ellipsis; letter-spacing:-.1px; }
  .yt-mic { width:36px; height:36px; border-radius:50%; background:#f2f2f2; flex-shrink:0; margin-left:8px;

  .yt-mic svg { width:21px; height:21px; display:block; }

  .yt-list { flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain;

  .yt-item { display:flex; align-items:center; min-height:50px; padding:4px 0; }

  /* ===== 관리자 패널 ===== */

  /* PC(마우스 쓰는 넓은 화면): 분류 · 검색기록 편집 · 미리보기 3단 */
  @media (min-width:1000px) and (pointer:fine){
    #phone { max-width:none; max-height:none; width:100vw; height:100vh; box-shadow:none; }
    body { background:#e9edf0; }
    #ytScreen { max-width:430px; margin:0 auto; width:100%; }  /* 손님 화면은 폰 모양 유지 */
    .admin-body { display:flex; gap:14px; align-items:stretch; overflow:hidden; padding:14px; }
    .apane { overflow-y:auto; min-width:0; padding-right:2px; }
    #paneHome { flex:0 0 360px; }
    #paneEdit { flex:1 1 auto; display:block; }
    #panePrev { flex:0 0 400px; display:block; }
    #editBox { display:none; }               /* 3단에서는 가운데 칸에 따로 나온다 */
  }
  .prev-wrap { background:#fff; border-radius:12px; overflow:hidden; border:1px solid #e3e7ec;
    height:720px; max-height:calc(100vh - 140px); display:flex; flex-direction:column; }
  .prev-wrap .yt { flex:1; }
  .prev-cap { font-size:12.5px; color:#6a7a8a; font-weight:700; margin:2px 2px 8px; }

  .admin-section { background:#fff; border-radius:12px; padding:16px; margin-bottom:14px; }
  .admin-section h3 { font-size:14px; color:#282828; margin-bottom:12px; font-weight:700;
    display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .field { margin-bottom:12px; }
  .field label { display:block; font-size:12.5px; color:#6a7a8a; margin-bottom:5px; font-weight:600; }
  .field input, .field textarea, .field select {
    width:100%; border:1px solid #d5dae0; border-radius:8px; padding:9px 11px;
    font-size:14px; font-family:inherit; background:#fff; }
  .field textarea { resize:vertical; min-height:120px; line-height:1.5; }
  .btn { border:none; border-radius:8px; padding:10px 14px; font-size:14px; cursor:pointer;
    font-weight:600; white-space:nowrap; flex-shrink:0; font-family:inherit; }
  .btn:disabled { opacity:.45; cursor:default; }
  .btn-primary { background:#282828; color:#fff; }
  .btn-red { background:#ff0033; color:#fff; }
  .btn-ghost { background:#eef0f3; color:#282828; }
  .btn-danger { background:#ffe5e3; color:#d63a2f; }
  .btn-sm { padding:6px 10px; font-size:12.5px; }
  .btn-block { width:100%; margin-top:6px; }
  .row-actions { display:flex; gap:6px; flex-wrap:wrap; align-items:center; }

  .admin-list-item { border:1px solid #e3e7ec; border-radius:10px; padding:11px 12px;
    margin-bottom:9px; background:#fff; }
  .admin-list-item.on { border-color:#282828; background:#f7f8f9; }
  .admin-list-item.picked { border-color:#ff4e45; background:#fff5f5; box-shadow:0 0 0 2px #ff003322 inset; }
  .admin-list-item .top { display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .admin-list-item .rsub { font-size:12px; color:#8a97a5; margin-top:2px; word-break:break-all; }
  .me-tag { background:#ff0033; color:#fff; font-size:10.5px; font-weight:700;
    padding:2px 6px; border-radius:6px; display:inline-block; margin-top:4px; }

  /* 끌어서 순서 바꾸기 */
  .sortable .admin-list-item { touch-action:manipulation; }
  .admin-list-item.dragging { opacity:.92; box-shadow:0 8px 20px rgba(0,0,0,.18);
    border-color:#282828; position:relative; z-index:5; }
  .drag-hint { font-size:11.5px; color:#98a5b2; margin:0 0 8px; }

  /* 폴더 경로 표시 */
  .crumb { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:8px; }
  .crumb-txt { font-size:13px; font-weight:700; color:#282828; word-break:break-all; }
  .crumb-txt .sep { color:#a8b4c0; font-weight:400; margin:0 3px; }
  .node-name { font-weight:700; font-size:14.5px; color:#1f1f1f; cursor:pointer; word-break:break-all; }
  .node-name .pen { font-size:11px; color:#a8b4c0; margin-left:4px; }

  /* 접었다 펴는 섹션 */
  .admin-section h3.foldable { cursor:pointer; user-select:none; }
  .fold-arrow { font-size:11px; color:#8a97a5; margin-left:6px; }
  .admin-section.folded .fold-body { display:none; }

  /* 검색기록 편집 줄 */
  .hist-row { display:flex; align-items:center; gap:6px; margin-bottom:7px; }
  .hist-row .no { width:22px; flex-shrink:0; text-align:right; font-size:12px; color:#98a5b2; font-weight:700; }
  .hist-row input { flex:1; min-width:0; border:1px solid #d5dae0; border-radius:8px; padding:8px 10px;
    font-size:14px; font-family:inherit; }
  .hist-row input:focus { outline:none; border-color:#282828; }
  .hist-row .btn { padding:6px 8px; }

  .hint { font-size:12px; color:#98a5b2; line-height:1.6; margin-top:8px; }
  .kv { font-size:12.5px; color:#6a7a8a; line-height:1.8; word-break:break-all; }
  .kv b { color:#282828; }

  .mode-pill { position:absolute; bottom:14px; left:12px; z-index:40; background:rgba(0,0,0,.45);
    color:#fff; font-size:11px; padding:3px 9px; border-radius:10px; display:none; pointer-events:none; }
  .mode-pill.show { display:block; }

  .toast { position:absolute; bottom:80px; left:50%; transform:translateX(-50%);
    background:rgba(0,0,0,.8); color:#fff; padding:10px 18px; border-radius:20px; font-size:13px;
    z-index:220; opacity:0; transition:opacity .25s; pointer-events:none; max-width:80%; text-align:center; }
  .toast.show { opacity:1; }

  #confirmBox { display:none; position:absolute; top:0;right:0;bottom:0;left:0; z-index:240; background:rgba(0,0,0,.4);
    align-items:center; justify-content:center; padding:30px; }
  #confirmBox.show { display:flex; }
  .confirm-card { background:#fff; border-radius:14px; padding:22px 20px 16px; width:100%;
    max-width:300px; box-shadow:0 10px 40px rgba(0,0,0,.3); }
  .confirm-msg { font-size:15px; color:#282828; line-height:1.5; margin-bottom:18px; text-align:center; white-space:pre-line; }
  .confirm-actions { display:flex; gap:8px; }
  .confirm-actions .btn { flex:1; padding:11px; }
</style>
<!-- ===================== 구형 브라우저 호환 블록 =====================
     삼성 인터넷 5.0(2016년 갤럭시) 이상, 크롬 49 이상에서도 앱이 열리도록
     없는 기능을 대신 채워 넣는다. 최신 기기에서는 아무 일도 하지 않는다. -->
<style id="oldBrowserCss">
/* (유튜브 화면은 grid를 쓰지 않는다) */
@supports not (display:grid){
  .avatar.grp{ display:flex; flex-wrap:wrap; }
  .avatar.grp>*{ box-sizing:border-box; }
  .avatar.grp.n1>*{ width:100%; height:100%; }
  .avatar.grp.n2>*{ width:50%; height:100%; }
  .avatar.grp.n3>*,.avatar.grp.n4>*{ width:50%; height:50%; }
}
</style>
<script>
(function(){
  'use strict';

  /* ---------- 1. 없는 자바스크립트 기능 채우기 ---------- */

  /* 숫자 앞에 0을 붙일 때 쓴다 (시각 표시). 크롬 57 미만에 없음 */
  if(!String.prototype.padStart){
    String.prototype.padStart = function(len, pad){
      var s = String(this);
      pad = (pad === undefined) ? ' ' : String(pad);
      if(s.length >= len || pad === '') return s;
      var fill = '';
      while(fill.length < len - s.length) fill += pad;
      return fill.slice(0, len - s.length) + s;
    };
  }
  if(!String.prototype.padEnd){
    String.prototype.padEnd = function(len, pad){
      var s = String(this);
      pad = (pad === undefined) ? ' ' : String(pad);
      if(s.length >= len || pad === '') return s;
      var fill = '';
      while(fill.length < len - s.length) fill += pad;
      return s + fill.slice(0, len - s.length);
    };
  }

  /* 앱 설치 안내를 닫을 때 쓴다. 크롬 63 미만에 없음 */
  if(window.Promise && !Promise.prototype['finally']){
    Promise.prototype['finally'] = function(cb){
      var P = this.constructor || Promise;
      return this.then(
        function(v){ return P.resolve(cb()).then(function(){ return v; }); },
        function(e){ return P.resolve(cb()).then(function(){ throw e; }); }
      );
    };
  }

  /* 화면 요소를 한꺼번에 훑을 때 쓴다. 크롬 51 미만에 없어서 앱이 멈춘다 */
  ['NodeList','HTMLCollection','DOMTokenList'].forEach(function(n){
    var C = window[n];
    if(C && C.prototype && !C.prototype.forEach){
      C.prototype.forEach = Array.prototype.forEach;
    }
  });

  if(!Object.entries){
    Object.entries = function(o){
      var r = [], k;
      for(k in o){ if(Object.prototype.hasOwnProperty.call(o, k)) r.push([k, o[k]]); }
      return r;
    };
  }
  if(!Object.values){
    Object.values = function(o){
      var r = [], k;
      for(k in o){ if(Object.prototype.hasOwnProperty.call(o, k)) r.push(o[k]); }
      return r;
    };
  }
  if(!Array.prototype.includes){
    Array.prototype.includes = function(v){ return this.indexOf(v) !== -1; };
  }
  if(window.Element && !Element.prototype.closest){
    var m = Element.prototype.matches || Element.prototype.webkitMatchesSelector ||
            Element.prototype.msMatchesSelector;
    Element.prototype.matches = m;
    Element.prototype.closest = function(sel){
      var e = this;
      while(e && e.nodeType === 1){ if(m.call(e, sel)) return e; e = e.parentElement; }
      return null;
    };
  }

  /* ---------- 2. 칸 사이 여백(gap) 대신 여백 직접 계산 ---------- */
  /* 크롬 84 미만에서는 flex 안의 gap이 무시되어 글자·버튼이 다 붙어 보인다.
     그래서 스타일을 훑어 gap이 쓰인 곳을 찾아 바깥여백으로 바꿔 준다. */

  var gapStyle = null;

  function flexGapWorks(){
    var box = document.createElement('div');
    box.style.cssText = 'display:flex;flex-direction:column;row-gap:1px;' +
                        'position:absolute;visibility:hidden;height:0;overflow:visible';
    box.appendChild(document.createElement('div'));
    box.appendChild(document.createElement('div'));
    var host = document.body || document.documentElement;
    host.appendChild(box);
    var ok = box.scrollHeight === 1;
    host.removeChild(box);
    return ok;
  }

  function firstValue(v){
    v = (v || '').trim();
    if(!v || v === 'normal') return '';
    return v.split(/\s+/)[0];
  }
  function secondValue(v){
    v = (v || '').trim();
    if(!v || v === 'normal') return '';
    var p = v.split(/\s+/);
    return p[1] || p[0];
  }

  function collect(rules, out){
    if(!rules) return;
    for(var i = 0; i < rules.length; i++){
      var r = rules[i];
      if(r.cssRules && r.cssRules.length) collect(r.cssRules, out);   /* @media 안쪽까지 */
      if(!r.style || !r.selectorText) continue;
      if(r.style.gridTemplateColumns || r.style.gridTemplateRows) continue;  /* 표 배치는 따로 처리 */
      if((r.style.display || '').indexOf('grid') >= 0) continue;

      var g  = r.style.getPropertyValue('gap');
      var rg = (r.style.getPropertyValue('row-gap')    || firstValue(g)).trim();
      var cg = (r.style.getPropertyValue('column-gap') || secondValue(g)).trim();
      if(rg === 'normal') rg = '';
      if(cg === 'normal') cg = '';
      if(!rg && !cg) continue;

      out.push({ sel: r.selectorText, rg: rg, cg: cg,
                 disp: (r.style.display || '').trim(),
                 dir:  (r.style.flexDirection || '').trim(),
                 wrap: (r.style.flexWrap || '').trim() });
    }
  }

  function buildGapCss(){
    var found = [];
    var sheets = document.styleSheets;
    for(var i = 0; i < sheets.length; i++){
      try { collect(sheets[i].cssRules, found); } catch(e){ /* 읽을 수 없는 스타일은 건너뛴다 */ }
    }

    var css = [];
    for(var k = 0; k < found.length; k++){
      var f = found[k];
      var parts = f.sel.split(',');
      for(var s = 0; s < parts.length; s++){
        var sel = parts[s].trim();
        if(!sel || sel.indexOf('::') >= 0) continue;

        /* 실제 화면에 있는 요소를 보고 가로줄인지 세로줄인지 판단한다 */
        var el = null, cs = null;
        try { el = document.querySelector(sel); } catch(e){ continue; }
        if(el && window.getComputedStyle) cs = window.getComputedStyle(el);

        var disp = f.disp || (cs ? cs.display : '');
        if(disp.indexOf('flex') < 0) continue;          /* flex가 아니면 손대지 않는다 */

        var dir  = f.dir  || (cs ? (cs.flexDirection || 'row') : 'row');
        var wrap = f.wrap || (cs ? (cs.flexWrap || 'nowrap') : 'nowrap');
        var column = dir.indexOf('column') === 0;

        if(wrap.indexOf('wrap') === 0){
          /* 줄바꿈되는 묶음은 모든 칸에 여백을 준다 */
          if(f.cg) css.push(sel + '>*{margin-right:' + f.cg + '}');
          if(f.rg) css.push(sel + '>*{margin-bottom:' + f.rg + '}');
        } else if(column){
          if(f.rg) css.push(sel + '>*+*{margin-top:' + f.rg + '}');
        } else {
          if(f.cg) css.push(sel + '>*+*{margin-left:' + f.cg + '}');
        }
      }
    }

    if(!gapStyle){
      gapStyle = document.createElement('style');
      gapStyle.id = 'oldBrowserGap';
      (document.head || document.documentElement).appendChild(gapStyle);
    }
    gapStyle.textContent = css.join('\n');
  }

  function startGapFix(){
    try {
      if(flexGapWorks()) return;            /* 요즘 기기 — 그대로 둔다 */
      buildGapCss();
      /* 앱이 화면을 다 그린 뒤 한 번 더 — 그때 생긴 부분까지 맞춘다 */
      setTimeout(buildGapCss, 1200);
      setTimeout(buildGapCss, 3000);

function idbOpen(){
  return new Promise((res, rej)=>{
    if(!self.indexedDB){ idbState = 'unavailable'; return rej(new Error('없음')); }
    if(location.protocol === 'file:'){ idbState = 'unavailable'; return rej(new Error('파일 직접 열기')); }

    const finish = (fn, v)=>{ if(!settled){ settled = true; clearTimeout(timer); fn(v); } };
    const timer = setTimeout(()=>{
      if(!settled){ settled = true; idbState = 'unavailable'; rej(new Error('시간 초과')); }
    }, 2500);
    let rq;
    try{ rq = indexedDB.open(IDB_NAME, 1); }
    catch(e){ idbState = 'unavailable'; return finish(rej, e); }
    rq.onupgradeneeded = ()=>{ try{ rq.result.createObjectStore(IDB_STORE); }catch(e){} };
    rq.onsuccess = ()=>{ idbState = 'ok'; finish(res, rq.result); };
    rq.onerror   = ()=>{ if(idbState !== 'unavailable') idbState = 'error'; finish(rej, rq.error || new Error('열기 실패')); };
    rq.onblocked = ()=>{ idbState = 'unavailable'; finish(rej, new Error('차단됨')); };

    let tx;
    try{ tx = db.transaction(IDB_STORE, 'readonly'); }
    catch(e){ return res({ok:false, value:null}); }
    const rq = tx.objectStore(IDB_STORE).get(IDB_KEY);
    rq.onsuccess = ()=> res({ok:true, value:rq.result || null});
    rq.onerror   = ()=> res({ok:false, value:null});
  })).catch(()=> ({ok:false, value:null}));
}
function idbWrite(v){
  return idbOpen().then(db=> new Promise((res, rej)=>{
    const tx = db.transaction(IDB_STORE, 'readwrite');
    tx.objectStore(IDB_STORE).put(v, IDB_KEY);
    tx.oncomplete = ()=> res(true);
    tx.onerror    = ()=> rej(tx.error || new Error('저장 실패'));
    tx.onabort    = ()=> rej(tx.error || new Error('저장 중단'));
  }));
}
function idbClear(){
  return idbOpen().then(db=> new Promise(res=>{
    const tx = db.transaction(IDB_STORE, 'readwrite');
    tx.objectStore(IDB_STORE).delete(IDB_KEY);
    tx.oncomplete = ()=> res(true);
    tx.onerror    = ()=> res(false);
    tx.onabort    = ()=> res(false);
  })).catch(()=> false);
}
let persistState = '확인 중';

  const i = txt.indexOf(MARK_S), j = txt.indexOf(MARK_E);

function id(){ return 'x'+Math.random().toString(36).slice(2,9); }
function normKey(s){ return String(s||'').trim().toLowerCase().replace(/\s+/g,'_'); }

function personId(name){
  const s = normKey(name);

  for(let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = (h * 0x01000193) >>> 0; }

  if(d.caret === undefined) d.caret = true;
  if(!Array.isArray(d.tree)) d.tree = [];
  d.tree = d.tree.filter(isObj);
  d.tree.forEach(c1=>{
    if(!c1.id) c1.id = id();
    c1.name = String(c1.name || '지점');
    if(!Array.isArray(c1.children)) c1.children = [];
    c1.children = c1.children.filter(isObj);
    c1.children.forEach(c2=>{
      if(!c2.id) c2.id = id();
      c2.name = String(c2.name || '테마');
      if(!Array.isArray(c2.people)) c2.people = [];
      c2.people = c2.people.filter(isObj);
      const used = {};
      c2.people.forEach(p=>{
        p.name = String(p.name || '인물');
        if(!p.id || used[p.id]){
          let pid = personId(p.name), n = 2;
          while(used[pid]) pid = personId(p.name) + '_' + (n++);
          p.id = pid;
        }
        used[p.id] = 1;
        if(!Array.isArray(p.history)) p.history = [];
        p.history = p.history.filter(t=> typeof t === 'string' || typeof t === 'number').map(String);
      });
    });
  });
  return d;
}

/* ---------- 이 폰의 지점 잠금 ----------
   폰 한 대는 한 지점만 본다. 처음 실행할 때 고르고, 그 뒤에는 바꿀 수 없다.
   (바꿔야 하면 주소 끝에 ?reset=1 을 붙여 이 기기 설정을 초기화한다) */
let branchLock = null;              /* {id, name} — 기기마다 따로 저장된다 */
function loadBranch(){
  try{ const v = JSON.parse(localStorage.getItem(BRANCH_KEY)); branchLock = isObj(v) ? v : null; }
  catch(e){ branchLock = null; }
}
function saveBranch(){
  try{
    if(branchLock) localStorage.setItem(BRANCH_KEY, JSON.stringify(branchLock));
    else localStorage.removeItem(BRANCH_KEY);
  }catch(e){}
}
/* 잠긴 지점. 이름이 바뀌어도 id 로 따라가고, id 가 바뀌면 이름으로 찾아 고쳐 둔다 */
function lockedC1(){
  if(!branchLock || !data) return null;
  const byId = data.tree.find(c=>c.id === branchLock.id);
  if(byId){
    if(branchLock.name !== byId.name){ branchLock.name = byId.name; saveBranch(); }
    return byId;
  }
  const byName = data.tree.find(c=>c.name === branchLock.name);
  if(byName){ branchLock = {id:byName.id, name:byName.name}; saveBranch(); return byName; }
  return null;
}
/* PC(편집용)에서는 잠그지 않는다 — 제작자는 전체를 봐야 한다 */
function branchLocked(){ return !wideAdmin() && !!lockedC1(); }
function setBranch(c1){ branchLock = {id:c1.id, name:c1.name}; saveBranch(); }
function allowedC1s(){
  const lk = branchLocked() ? lockedC1() : null;
  return lk ? [lk] : data.tree;
}
function enforceBranchLock(){
  const lk = branchLocked() ? lockedC1() : null;
  if(!lk) return;
  if(treePath[0] !== lk.id){ treePath = [lk.id]; editPid = ''; }
}
function treeMinDepth(){ return branchLocked() ? 1 : 0; }

/* ---------- 이 기기에서 볼 인물 (테마 + 인물) ----------
   viewAs = { c2:{id,name}, p:{id,name} } — 기기마다 따로 저장된다.
   id 로 먼저 찾고, 못 찾으면 이름으로 찾아 고쳐 둔다
   (내용을 새 파일로 바꿔도 폰에서 고른 사람이 그대로 유지된다) */
let viewAs = null;
function loadView(){
  try{ const v = JSON.parse(localStorage.getItem(VIEW_KEY)); viewAs = isObj(v) ? v : null; }
  catch(e){ viewAs = null; }
}
function saveView(){
  try{
    if(viewAs) localStorage.setItem(VIEW_KEY, JSON.stringify(viewAs));
    else localStorage.removeItem(VIEW_KEY);
  }catch(e){}
}
function findC2(want){
  if(!isObj(want)) return null;
  const c1s = allowedC1s();
  let hit = null;
  c1s.forEach(c1=> (c1.children||[]).forEach(c2=>{ if(!hit && want.id && c2.id === want.id) hit = {c1:c1, c2:c2}; }));
  if(!hit && want.name){
    c1s.forEach(c1=> (c1.children||[]).forEach(c2=>{ if(!hit && c2.name === want.name) hit = {c1:c1, c2:c2}; }));
  }
  return hit;
}
function findPerson(c2, want){
  if(!c2 || !isObj(want)) return null;
  const ps = c2.people || [];
  return (want.id && ps.find(p=>p.id === want.id))
      || (want.name && ps.find(p=>normKey(p.name) === normKey(want.name)))
      || null;
}
/* 고른 인물 {c1, c2, p} — 없으면 null */
function meRef(){
  if(!viewAs || !data) return null;
  const t = findC2(viewAs.c2);
  const p = t ? findPerson(t.c2, viewAs.p) : null;
  if(!t || !p) return null;
  if(viewAs.c2.id !== t.c2.id || viewAs.c2.name !== t.c2.name || viewAs.p.id !== p.id || viewAs.p.name !== p.name){
    viewAs = { c2:{id:t.c2.id, name:t.c2.name}, p:{id:p.id, name:p.name} }; saveView();
  }
  return { c1:t.c1, c2:t.c2, p:p };
}
function mePerson(){ const r = meRef(); return r ? r.p : null; }
function setMe(c2, p){
  viewAs = (c2 && p) ? { c2:{id:c2.id, name:c2.name}, p:{id:p.id, name:p.name} } : null;
  saveView();
}
function isMe(c2, p){
  const r = meRef();
  return !!r && r.c2 === c2 && r.p === p;
}

/* 설치가 안 될 때 원인을 한 화면에 모아 보여준다 */
function runDiag(){
  const out = [];
  const ua = navigator.userAgent || '';
  const cm = ua.match(/Chrome\/(\d+)/);
  const cv = cm ? Number(cm[1]) : 0;
  const inApp = /; wv\)|\bwv\b|KAKAOTALK|FBAN|FB_IAB|Instagram|NAVER|Line\//i.test(ua);
  out.push('코드 버전: ' + CODE_VERSION + ' / 파일 버전: ' + DATA_VERSION);
  out.push('브라우저: ' + (cm ? ('Chrome ' + cm[1]) : '크롬 아님 또는 확인 불가'));
  out.push('버전 판정: ' + (cv === 0 ? '확인 불가' : (cv >= 76 ? '앱 설치 지원 버전' : '너무 오래된 버전 — 크롬 업데이트 필요')));
  out.push('내장 브라우저: ' + (inApp ? '예 — 크롬 앱에서 직접 열어야 설치됩니다' : '아니오'));
  out.push('https(보안) 상태: ' + (window.isSecureContext ? '정상' : '아님 — 설치 불가'));
  out.push('서비스워커 지원: ' + (('serviceWorker' in navigator) ? '지원' : '지원 안 함'));
  out.push('서비스워커 상태: ' + swState);
  out.push('설치 신호(beforeinstallprompt): ' + (deferredInstall ? '받음' : '아직 없음'));
  const box = document.getElementById('diagOut');
  box.style.display = 'block';
  box.textContent = out.join('\n') + '\n서버 응답 확인 중…';
  const jobs = [];
  jobs.push(fetch('./sw.js?diag=' + Date.now(), {cache:'no-store'})
    .then(r=> 'sw.js 응답: ' + r.status + ' / ' + (r.headers.get('content-type')||'?'))
    .catch(e=> 'sw.js 응답: 실패 (' + e + ')'));
  jobs.push(fetch('./manifest.webmanifest', {cache:'no-store'})
    .then(r=> r.json().then(j=> '매니페스트 응답: ' + r.status + ' / 이름 ' + j.name, ()=> '매니페스트 응답: ' + r.status + ' / 내용 읽기 실패'))
    .catch(()=> '매니페스트 응답: 실패'));
  jobs.push((('serviceWorker' in navigator) ? navigator.serviceWorker.getRegistrations() : Promise.resolve([]))
    .then(rs=> '등록된 서비스워커: ' + rs.length + '개')
    .catch(()=> '등록 목록 확인 실패'));
  Promise.all(jobs).then(extra=>{ box.textContent = out.concat(extra).join('\n'); });
}

let editPid = '';           /* 검색기록을 편집 중인 인물 (지금 중분류 안) */

    const lk = branchLocked() ? lockedC1() : null;

/* ----- 끌어서 순서 바꾸기 (마우스·터치 공용) ----- */
function makeSortable(box, onDone){
  if(!box) return;
  box.classList.add('sortable');
  let el = null, armed = false, dragging = false, startY = 0, timer = null;
  const items = ()=> [].slice.call(box.querySelectorAll('[data-sort]'));
  const stop = ()=>{
    clearTimeout(timer);
    if(el) el.classList.remove('dragging');
    const did = dragging;
    el = null; armed = false; dragging = false;
    if(did) onDone(items().map(x=>x.dataset.sort));
  };
  box.addEventListener('pointerdown', e=>{
    const t = e.target.closest('[data-sort]');
    if(!t || e.target.closest('button, input, textarea, select, .node-name')) return;
    el = t; startY = e.clientY; armed = false; dragging = false;
    if(e.pointerType === 'mouse'){ armed = true; }
    else { timer = setTimeout(()=>{ armed = true; el.classList.add('dragging'); }, 280); }
  });
  box.addEventListener('pointermove', e=>{
    if(!el) return;
    if(!armed){
      if(Math.abs(e.clientY - startY) > 8){ clearTimeout(timer); el = null; }
      return;
    }
    if(!dragging){
      if(Math.abs(e.clientY - startY) < 4) return;
      dragging = true;
      el.classList.add('dragging');
      try{ el.setPointerCapture(e.pointerId); }catch(err){}
    }
    const y = e.clientY;
    items().forEach(s=>{
      if(s === el) return;
      const r = s.getBoundingClientRect();
      if(y > r.top && y < r.bottom){
        const mid = r.top + r.height/2;
        if(y < mid) box.insertBefore(el, s);
        else box.insertBefore(el, s.nextSibling);
      }
    });
  });
  box.addEventListener('pointerup', stop);
  box.addEventListener('pointercancel', stop);
  box.addEventListener('touchmove', e=>{ if(dragging) e.preventDefault(); }, {passive:false});
}

function uniqueName(existing, base){
  let n = base, i = 2;
  while(existing.indexOf(n) !== -1){ n = base + ' ' + i; i++; }
  return n;
}

function bindTreeSection(body){
  body.querySelectorAll('[data-fold]').forEach(h=>{
    h.onclick = ()=>{ const k = h.dataset.fold; foldState[k] = !foldState[k]; renderAdminHome(); };
  });
  const up = $('#treeUp');
  if(up) up.onclick = ()=>{
    if(treePath.length <= treeMinDepth()) return;   /* 잠긴 지점 위로는 못 올라간다 */
    treePath.pop(); editingNode = ''; editPid = '';
    renderAdminHome();
  };
  body.querySelectorAll('[data-enter]').forEach(b=> b.onclick = ()=>{
    treePath.push(b.dataset.enter); editingNode = ''; editPid = '';
    const c2 = curC2();
    if(c2){
      /* 테마를 열면 이 기기의 인물(없으면 첫 인물)을 바로 편집 상태로 */
      const r = meRef();
      const p = (r && r.c2 === c2) ? r.p : (c2.people||[])[0];
      editPid = p ? p.id : '';
    }
    renderAdminHome(true);
  });
  body.querySelectorAll('[data-pedit]').forEach(b=> b.onclick = ()=>{
    editPid = b.dataset.pedit; renderAdminHome();
    if(!wideAdmin()){
      const eb = $('#editBox'); if(eb) eb.scrollIntoView({behavior:'smooth', block:'start'});
    }
  });
  body.querySelectorAll('[data-pme]').forEach(b=> b.onclick = ()=>{
    const c2 = curC2(); if(!c2) return;
    const p = c2.people.find(x=>x.id === b.dataset.pme); if(!p) return;
    setMe(c2, p); editPid = p.id; renderAdminHome();
    toast('이 기기에서 볼 사람을 “' + p.name + '”(으)로 정했습니다');
  });
  body.querySelectorAll('[data-pdel]').forEach(b=> b.onclick = ()=>{
    const c2 = curC2(); if(!c2) return;
    const p = c2.people.find(x=>x.id === b.dataset.pdel); if(!p) return;
    const n = histOf(p).length;
    confirmDialog('인물 “' + p.name + '” 을(를) 지울까요?' + (n ? '\n검색기록 ' + n + '개도 함께 지워집니다.' : ''), ()=>{
      const wasMe = isMe(c2, p);
      c2.people = c2.people.filter(x=>x !== p);
      if(editPid === p.id) editPid = '';
      if(wasMe) setMe(null, null);
      save(); renderAdminHome(); toast('지웠습니다');
    });
  });
  body.querySelectorAll('[data-rename]').forEach(el=>{
    el.onclick = ev=>{ if(ev.target.classList.contains('pen')){ editingNode = el.dataset.rename; renderAdminHome(); } };
    el.ondblclick = ()=>{ editingNode = el.dataset.rename; renderAdminHome(); };
  });

  const nSave = $('#nodeSave');
  if(nSave){
    $('#nodeCancel').onclick = ()=>{ editingNode = ''; renderAdminHome(); };
    const nName = $('#nodeName');
    nName.onkeydown = e=>{ if(e.key === 'Enter') nSave.click(); };
    try{ nName.focus(); nName.select(); }catch(e){}
    nSave.onclick = ()=>{
      const nameVal = nName.value.trim();
      if(!nameVal){ toast('이름을 입력하세요'); return; }
      const kind = editingNode.slice(0, editingNode.indexOf(':'));
      const nid = editingNode.slice(editingNode.indexOf(':') + 1);
      if(kind === 'c1'){
        const node = data.tree.find(c=>c.id === nid);
        if(node) node.name = nameVal;
      } else if(kind === 'c2'){
        const c1 = curC1();
        const node = c1 && c1.children.find(c=>c.id === nid);
        if(node) node.name = nameVal;
      } else if(kind === 'P'){
        const c2 = curC2();
        const p = c2 && c2.people.find(x=>x.id === nid);
        if(p){
          if(c2.people.some(x=>x !== p && normKey(x.name) === normKey(nameVal))){ toast('같은 이름의 인물이 이미 있습니다'); return; }
          const wasMe = isMe(c2, p);
          p.name = nameVal;
          if(wasMe) setMe(c2, p);
        }
      }
      editingNode = ''; save(); renderAdminHome(); toast('저장되었습니다');
    };
  }

  const add = $('#treeAdd');
  if(add) add.onclick = ()=>{
    const c1 = curC1(), c2 = curC2();
    if(!c1){
      const node = { id:id(), name:uniqueName(data.tree.map(x=>x.name), '새 지점'), children:[] };
      data.tree.push(node); editingNode = 'c1:' + node.id;
    } else if(!c2){
      const node = { id:id(), name:uniqueName(c1.children.map(x=>x.name), '새 테마'), people:[] };
      c1.children.push(node); editingNode = 'c2:' + node.id;
    } else {
      const nm = uniqueName(c2.people.map(p=>p.name), '새 인물');
      let pid = personId(nm), n = 2;
      while(c2.people.some(x=>x.id === pid)) pid = personId(nm) + '_' + (n++);
      c2.people.push({ id:pid, name:nm, history:[] });
      editPid = pid; editingNode = 'P:' + pid;
    }
    save(); renderAdminHome();
  };

  body.querySelectorAll('[data-cdel]').forEach(b=> b.onclick = ()=>{
    const v = b.dataset.cdel;
    const isC1 = (v.indexOf('c1:') === 0);
    let node, removeIt, people = 0;
    if(isC1){
      const i = data.tree.findIndex(c=>c.id === v.slice(3));
      if(i < 0) return;
      node = data.tree[i]; people = c1Count(node).people;
      removeIt = ()=> data.tree.splice(i, 1);
    } else {
      const c1 = curC1(); if(!c1) return;
      const i = c1.children.findIndex(c=>c.id === v.slice(3));
      if(i < 0) return;
      node = c1.children[i]; people = (node.people||[]).length;
      removeIt = ()=> c1.children.splice(i, 1);
    }
    const doIt = ()=>{ removeIt(); save(); renderAdminHome(); toast('삭제되었습니다'); };
    if(people) confirmDialog('“' + node.name + '” 안에 인물 ' + people + '명이 있습니다.\n검색기록까지 모두 삭제할까요?', doIt, '모두 삭제');
    else confirmDialog('“' + node.name + '” 을(를) 삭제할까요?', doIt);
  });

  /* 테마 복제 = 인물·검색기록을 통째로 복사 */
  body.querySelectorAll('[data-ccopy]').forEach(b=> b.onclick = ()=>{
    const c1 = curC1(); if(!c1) return;
    const src = c1.children.find(c=>c.id === b.dataset.ccopy); if(!src) return;
    const copy = deepCopy(src);
    copy.id = id();
    copy.name = uniqueName(c1.children.map(x=>x.name), src.name + ' 사본');
    c1.children.splice(c1.children.indexOf(src) + 1, 0, copy);
    save(); renderAdminHome(); toast('복제되었습니다');
  });

  makeSortable($('#treeBox'), order=>{
    const c1 = curC1(), c2 = curC2();
    const pick = (arr)=> order.map(v=>arr.find(x=>x.id === v)).filter(Boolean).concat(arr.filter(x=>order.indexOf(x.id) < 0));
    if(!c1) data.tree = pick(data.tree);
    else if(!c2) c1.children = pick(c1.children);
    else c2.people = pick(c2.people);
    save(); renderAdminHome(); toast('순서가 바뀌었습니다');
  });
}

function bindEditor(root){
  const p = editPerson(); if(!p) return;
  root.querySelectorAll('[data-fold]').forEach(h=>{
    h.onclick = ()=>{ const k = h.dataset.fold; foldState[k] = !foldState[k]; renderEditor(); };
  });
  const rerender = (focusIdx)=>{
    save(); renderAdminHome();
    if(focusIdx !== undefined){
      const inp = document.querySelector('input[data-hi="' + focusIdx + '"]');
      if(inp){ try{ inp.focus(); }catch(e){} }
    }
  };
  root.querySelectorAll('[data-hi]').forEach(inp=>{
    inp.oninput = ()=>{
      p.history[+inp.dataset.hi] = inp.value;
      saveSoon(); refreshPreview();
      const cnt = root.querySelector('#editSec h3 .rsub'); if(cnt) cnt.textContent = histOf(p).length + '개';
    };
    inp.onkeydown = e=>{
      if(e.key !== 'Enter') return;
      /* 엔터 = 바로 아래에 새 줄 */
      const i = +inp.dataset.hi;
      p.history.splice(i + 1, 0, '');
      rerender(i + 1);
    };
  });
  const swap = (i, j)=>{ const h = p.history; const t = h[i]; h[i] = h[j]; h[j] = t; };
  root.querySelectorAll('[data-hup]').forEach(b=> b.onclick = ()=>{ const i = +b.dataset.hup; swap(i, i-1); rerender(); });
  root.querySelectorAll('[data-hdown]').forEach(b=> b.onclick = ()=>{ const i = +b.dataset.hdown; swap(i, i+1); rerender(); });
  root.querySelectorAll('[data-hdel]').forEach(b=> b.onclick = ()=>{ p.history.splice(+b.dataset.hdel, 1); rerender(); });
  const at = root.querySelector('#hAddTop'); if(at) at.onclick = ()=>{ p.history.unshift(''); rerender(0); };
  const ab = root.querySelector('#hAddBottom'); if(ab) ab.onclick = ()=>{ p.history.push(''); rerender(p.history.length - 1); };
  const ba = root.querySelector('#bulkApply');
  if(ba) ba.onclick = ()=>{
    const lines = root.querySelector('#bulkText').value.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
    confirmDialog('지금 검색기록을 지우고 적은 ' + lines.length + '줄로 바꿀까요?', ()=>{
      p.history = lines; rerender(); toast('검색기록 ' + lines.length + '개로 바꿨습니다');
    }, '바꾸기');
  };
}

    <div class="admin-section">
      <h3>백업 / 복원</h3>
      <div class="hint" style="margin-top:0;margin-bottom:10px">모든 내용을 파일 하나로 내보내고, 다시 불러올 수 있습니다.</div>
      <button class="btn btn-ghost btn-block" id="exportBtn">내보내기 (파일 저장)</button>
      <button class="btn btn-ghost btn-block" id="importBtn">불러오기 (파일 열기)</button>
      <input type="file" id="importFile" accept="application/json,.json" style="display:none">
      <button class="btn btn-red btn-block" id="exportHtmlBtn">새 index.html 만들기</button>
      <div class="hint">지금 내용을 그대로 담은 배포용 index.html 을 만듭니다. 이 파일로 폴더의 index.html 을 바꾸면, 다른 폰에 설치할 때 이 내용이 들어갑니다.</div>
    </div>`;
  const scroller = wideAdmin() ? body : $('#adminBody');
  const prevScroll = resetScroll ? 0 : scroller.scrollTop;
  body.innerHTML = html;
  scroller.scrollTop = prevScroll;
  if(wideAdmin()) $('#editBox').innerHTML = '';
  renderEditor();
  finishAdminHome(body);
}

function finishAdminHome(body){
  refreshAdminInfo();
  $('#exportHtmlBtn').onclick = exportHtml;
  const eht = $('#exportHtmlTop'); if(eht) eht.onclick = exportHtml;
  $('#checkUpdate').onclick = ()=>{ toast('확인 중…'); checkForUpdate(true); };
  $('#saveAppName').onclick = ()=>{
    data.appName = $('#ed-appName').value.trim() || 'YouTube';
    save(); applyAppIdentity(); toast('앱 이름 저장됨');
  };
  $('#saveScreen').onclick = ()=>{
    data.placeholder = $('#ed-ph').value.trim() || 'YouTube 검색';
    data.caret = $('#ed-caret').checked;
    save(); renderGuest(); renderAdminHome(); toast('저장됨');
  };
  $('#installBtn').onclick = installApp;
  $('#diagBtn').onclick = runDiag;
  $('#resetFile').onclick = ()=> confirmDialog('폰에서 수정한 내용을 모두 지우고 파일 원본으로 되돌릴까요?', ()=>{
    data = normalize(deepCopy(EMBEDDED_DATA)); baseFp = fingerprint(data);
    save(); renderAdminHome(); toast('파일 원본으로 되돌렸습니다');
  }, '되돌리기');
  bindTreeSection(body);
  $('#exportBtn').onclick = exportData;
  $('#importBtn').onclick = ()=> $('#importFile').click();
  $('#importFile').onchange = importData;
}

/* ----- 백업/복원 ----- */
function downloadFile(name, text, mime){
  const blob = new Blob([text], {type: mime || 'text/plain;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 5000);
}
function newVersion(){
  const d = new Date(), p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
/* 서버 없이(파일을 직접 열었을 때도) 자기 자신의 소스를 만들어 낸다.
   화면에 그려둔 내용은 열 때마다 다시 그리므로 비워서 내보낸다. */
function selfHtml(){
  const root = document.documentElement.cloneNode(true);
  ['#histList','#branchList'].forEach(sel=>{ const el = root.querySelector(sel); if(el) el.innerHTML = ''; });
  const ap = root.querySelector('#adminBody');
  if(ap) ap.innerHTML = '<div class="apane" id="paneHome"></div><div class="apane" id="paneEdit"></div><div class="apane" id="panePrev"></div>';
  const off = (sel, cls)=>{ const el = root.querySelector(sel); if(el) el.classList.remove(cls); };
  off('#adminOverlay','active'); off('#pickBranch','show');
  off('#modePill','show'); off('#confirmBox','show'); off('#toast','show');
  const ts = root.querySelector('#toast'); if(ts) ts.textContent = '';
  const gs = root.querySelector('#oldBrowserGap'); if(gs) gs.remove();
  return '<!DOCTYPE html>\n' + root.outerHTML + '\n';
}
/* 호스팅 업체가 자동으로 끼워넣는 홍보·통계 코드를 걸러낸다. */
function stripHostInjected(html){
  let out = html;
  out = out.replace(/<!--(?:(?!-->)[\s\S]){0,1000}?netlify\.new(?:(?!-->)[\s\S]){0,1000}?-->\s*/gi, '');
  out = out.replace(/<meta\s+name="hosting-provider"[^>]*>\s*/gi, '');
  out = out.replace(/<meta\s+name="netlify-deploy"[^>]*>\s*/gi, '');
  out = out.replace(/<script\b[^>]*src="\/\.netlify\/[^>]*>\s*<\/script>\s*/gi, '');
  return out;
}
/* 지금 내용을 담은 새 index.html 을 만든다 (데이터 구간만 교체) */
function buildHtmlFrom(tpl){
  const src = stripHostInjected(tpl);
  const i = src.indexOf(MARK_S), j = src.indexOf(MARK_E);
  if(i < 0 || j <= i) return null;
  const ver = newVersion();
  const json = JSON.stringify(data, null, 1).replace(/<\//g, '<\\/');
  const block = MARK_S + ' 아래 두 줄이 이 파일에 들어있는 내용입니다. */\n'
    + 'const DATA_VERSION = ' + JSON.stringify(ver) + ';\n'
    + 'const EMBEDDED_DATA = ' + json + ';\n';
  return { html: src.slice(0,i) + block + src.slice(j), version: ver };
}
function finishExportHtml(built){
  if(!built){ toast('파일을 만들 수 없습니다'); return; }
  downloadFile('index.html', built.html, 'text/html;charset=utf-8');
  baseFp = fingerprint(data);
  save();
  toast('새 index.html 저장됨 · 버전 ' + built.version);
  if($('#adminOverlay').classList.contains('active')) renderAdminHome();
}
function exportHtml(){
  flushSave();
  if(location.protocol.indexOf('http') !== 0){
    confirmDialog(
      '지금 화면에 열려 있는 상태로 파일을 만듭니다.\n기능이 바뀐 파일을 새로 받았다면 먼저 새로고침(F5) 후에 만들어 주세요.',
      ()=> finishExportHtml(buildHtmlFrom(selfHtml())),
      '만들기'
    );
    return;
  }
  fetch('./index.html?_ex=' + Date.now(), {cache:'no-store'})
    .then(r=> r.ok ? r.text() : Promise.reject())
    .then(tpl=> finishExportHtml(buildHtmlFrom(tpl)))
    .catch(()=> finishExportHtml(buildHtmlFrom(selfHtml())));
}
function exportData(){
  flushSave();
  const payload = { app:'단서유튜브', version:DATA_VERSION, exportedAt:new Date().toISOString(), data:data };
  downloadFile('단서유튜브_백업.json', JSON.stringify(payload,null,2), 'application/json');
  toast('백업 파일을 저장했습니다');
}
function importData(e){
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try {
      const parsed = JSON.parse(reader.result);
      const body = (parsed && parsed.data) ? parsed.data : parsed;
      if(!body || !Array.isArray(body.tree)) throw new Error('bad');
      data = normalize(body);
      if(!baseFp) baseFp = fingerprint(normalize(deepCopy(EMBEDDED_DATA)));
      save();
      toast('불러왔습니다');
      renderGuest();
      renderAdminHome(true);
    } catch(err){ toast('올바른 백업 파일이 아닙니다'); }
  };
  reader.readAsText(file);
  e.target.value = '';
}

/* ---------- 이벤트 연결 ----------
   손님 화면은 아무것도 눌리지 않는다 (검색창·마이크·검색기록 모두 반응 없음).
   ← 화살표나 마이크를 5초 길게 누르면 관리자 모드. 관리자 상태에서는 마이크를 한 번 누르면 관리자 화면이 열린다. */
$('#adminClose').onclick = goBack;
$('#adminGuest').onclick = guestMode;
$('#btnMic').onclick = ()=>{ if(isAdmin && !$('#adminOverlay').classList.contains('active')) openAdmin(); };
window.addEventListener('popstate', closeTop);

/* 길게 누를 때 나오는 복사/검색/이미지 저장 메뉴 차단 (입력칸과 관리자 모드는 예외) */
document.addEventListener('contextmenu', e=>{
  const t = e.target;
  if(t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA')) return;
  if(isAdmin) return;
  e.preventDefault();
});
document.addEventListener('dragstart', e=>{ if(!isAdmin) e.preventDefault(); });

/* ← 화살표 또는 마이크를 5초 길게 누르면 관리자 모드 (손님 모드에서도 동작) */
let pressTimer = null;
function startPress(){ clearTimeout(pressTimer); pressTimer = setTimeout(()=>{ openAdmin(); }, 5000); }
function cancelPress(){ clearTimeout(pressTimer); }
['#btnBack', '#btnMic'].forEach(sel=>{
  const el = $(sel);
  el.addEventListener('mousedown', startPress);
  el.addEventListener('touchstart', startPress, {passive:true});
  ['mouseup','mouseleave','touchend','touchcancel'].forEach(ev=> el.addEventListener(ev, cancelPress));
});

/* ---------- 시작 ---------- */
/* 첫 화면 정하기
   - PC(넓은 화면)  : 편집용이므로 관리자 화면. 지점 잠금 없음.
   - 폰 · 처음      : 지점 고르기 → 그 지점 안에서 테마·인물 고르기
   - 폰 · 설정 끝난 뒤 : 손님 화면 (검색창을 누른 화면) */
let bootTries = 0;
function decideStartScreen(){
  if(!data) return;
  if(!window.innerWidth && bootTries < 20){ bootTries++; setTimeout(decideStartScreen, 200); return; }
  if(wideAdmin()){
    if(!isAdmin){ isAdmin = true; renderGuest(); openAdmin(!meRef()); }
    return;
  }
  if(!lockedC1() && data.tree.length){ renderBranchPicker(); return; }
  if(!meRef()){ if(!isAdmin){ isAdmin = true; renderGuest(); openAdmin(true); } return; }
  renderGuest();
}

let bootErrors = [];
function step(name, fn){
  try{ fn(); }
  catch(e){
    bootErrors.push({ where:name, err:e });
    try{ console.error('[단서유튜브] ' + name + ' 실패', e); }catch(x){}
  }
}
function showBootError(){
  const el = document.getElementById('histList');
  if(!el) return;
  const lines = bootErrors.map(b=>{
    const e = b.err || {};
    return '<b>' + esc(b.where) + '</b> — ' + esc(String(e.message || e.name || e));
  });
  el.innerHTML = '<div class="empty" style="user-select:text;-webkit-user-select:text">'
    + '내용을 불러오지 못했습니다.<br><br>주소 끝에 <b>?reset=1</b> 을 붙여 다시 열어보세요.<br><br>'
    + '<span style="font-size:11px">코드 버전 ' + esc(CODE_VERSION) + '<br>'
    + (lines.length ? lines.join('<br>') : '저장된 내용을 읽는 중 응답이 없습니다') + '</span></div>';
}

(function boot(){
  /* 주소 끝에 ?reset=1 을 붙여 열면 폰에 저장된 내용·고른 지점·인물·캐시를 전부 지우고 파일 내용으로 시작한다 */
  let first = Promise.resolve();
  if(/[?&]reset=1/.test(location.search)){
    try{ [STORE_KEY, BRANCH_KEY, VIEW_KEY].forEach(k=>localStorage.removeItem(k)); }catch(e){}
    try{ first = idbClear(); }catch(e){}
    try{ if(window.caches && caches.keys) caches.keys().then(ks=>ks.forEach(k=>{ if(isMyCache(k)) caches.delete(k); })); }catch(e){}
    try{
      if(navigator.serviceWorker && navigator.serviceWorker.getRegistrations){
        navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>{ if(isMySW(r)) r.unregister(); }));
      }
    }catch(e){}
    try{ history.replaceState(null, '', location.pathname); }catch(e){}
  }
  first.catch(()=>{}).then(load).then(d=>{
    data = d;
    step('loadView', loadView);
    step('loadBranch', loadBranch);
    step('save', save);
    step('renderGuest', renderGuest);
    try{ askPersist().then(()=>{ try{ refreshAdminInfo(); }catch(e){} }); }catch(e){}
    if(saveBlocked) setTimeout(()=>toast('저장된 내용을 읽지 못했습니다. 내용 보호를 위해 저장을 멈췄습니다 — 앱을 껐다 켜 주세요.'), 700);
    step('decideStartScreen', decideStartScreen);
    window.addEventListener('load', ()=> step('decideStartScreen', decideStartScreen));
    if(bootErrors.length) showBootError();
  }).catch(err=>{
    bootErrors.push({ where:'load', err:err });
    showBootError();
  });
})();
setTimeout(function(){
  if(!data){ bootErrors.push({ where:'load', err:{message:'저장된 내용을 읽는 중 응답이 없습니다'} }); showBootError(); }
}, 6000);

/* 서비스워커: 최신 파일 우선(network-first) + 예전 캐시 자동 삭제 */
if(!('serviceWorker' in navigator)) swState = '이 브라우저는 지원 안 함';
else if(location.protocol.indexOf('http') !== 0) swState = '파일 직접 열기 — 사용 불가';
else {
  navigator.serviceWorker.addEventListener('controllerchange', ()=>{ swState = '작동 중'; refreshAdminInfo(); });
  navigator.serviceWorker.register('./sw.js?v=' + encodeURIComponent(DATA_VERSION), {updateViaCache:'none'})
    .then(()=>{ swState = '등록됨 (제어 대기)'; refreshAdminInfo(); return navigator.serviceWorker.ready; })
    .then(()=>{ swState = navigator.serviceWorker.controller ? '작동 중' : '등록됨 (새로고침하면 작동)'; refreshAdminInfo(); })
    .catch(e=>{ swState = '등록 실패: ' + ((e && e.message) ? e.message : String(e)); refreshAdminInfo(); });
}

/* 실행할 때마다 서버의 index.html 을 확인해서 새 파일이면 갈아끼운다 */
setTimeout(function once(){
  if(!data){ setTimeout(once, 500); return; }
  checkForUpdate(false);
}, 1500);
</script>
